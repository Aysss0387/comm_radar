exclude_terms:
  - accounting fraud
  - tax fraud
  - insurance fraud
  - procurement fraud
  - financial statement fraud
  - wireless communication
  - communication protocol
  - optical communication
  - microarchitecture
  - hardware-aware
  - cloud-native credit
  - credit systems
  - financial statement
  - CPU optimization

exclude_title_patterns:
  - book review
  - book notes
  - corrigendum
  - correction
  - editorial
  - introduction to the special issue
  - table of contents
  - call for papers
  - 书评
  - 勘误
  - 目录

