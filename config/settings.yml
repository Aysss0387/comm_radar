window_months: 4
weekly_domestic_count: 2
weekly_international_count: 8
openalex_per_page: 100
openalex_max_pages: 6
crossref_rows: 50
semantic_scholar_batch_size: 100

profiles:
  communication_core:
    label: "传播学/计算传播"
    terms:
      - communication
      - computational communication
      - social media
      - platform governance
      - political communication
      - health communication
      - misinformation
      - disinformation
      - digital journalism
      - public opinion
