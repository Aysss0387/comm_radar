      - 电信诈骗
      - 钓鱼攻击
      - 风险传播
      - 预警信息
  ai_communication:
    label: "人工智能与传播"
    boost: true
    terms:
      - artificial intelligence
      - generative AI
      - large language model
      - LLM
      - AI-mediated communication
      - algorithmic recommendation
      - recommender system
      - AI literacy
      - AI misinformation
      - deepfake
      - synthetic media
      - chatbot
      - human-machine communication
      - platform algorithm
