exclude_terms:
  - accounting fraud
  - tax fraud
  - insurance fraud
  - procurement fraud
  - financial statement fraud
  - wireless communication
  - communication protocol
  - optical communication
  - microarchitecture
  - hardware-aware
  - cloud-native credit
  - credit systems
  - financial statement
  - CPU optimization

exclude_title_patterns:
  - book review
  - book notes
  - corrigendum
  - correction
  - editorial
  - introduction to the special issue
  - table of contents
  - call for papers
  - 书评
  - 勘误
  - 目录

# 期刊分层依据 2026 年 6 月发布的 JCR（2025 Impact Factor / Communication 学科排名）
authority_sources:
  tier_1:
    score: 100
    names:
      - name: Journal of Computer-Mediated Communication
        if_2025: 7.4
        rank: "Communication 4/227"
      - name: Political Communication
        if_2025: 5.9
      - name: Journal of Communication
        if_2025: 5.3
        rank: "Communication 11/227"
      - name: New Media & Society
      - name: Communication Research
  tier_2:
    score: 92
    names:
      - name: Human Communication Research
        if_2025: 3.4
        rank: "Communication 29/227"
      - name: Information, Communication & Society
      - name: Digital Journalism
      - name: Communication Methods and Measures
      - name: Communication Theory
      - name: Public Opinion Quarterly
      - name: Social Media + Society
      - name: Computers in Human Behavior
