name: Daily Paper Feed

on:
  schedule:
    # 08:00 Asia/Shanghai = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      skip_llm:
        description: "skip LLM deep-reading analysis"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  daily-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate daily feed
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          ARGS=(daily)
          if [ "${{ inputs.skip_llm }}" = "true" ]; then ARGS+=(--skip-llm); fi
          python -m comm_paper_radar "${ARGS[@]}"

      - name: Commit daily feed outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update daily deep-reading feed"
          file_pattern: "data/daily_feed.jsonl reports/daily/*.md"

      - name: Send daily email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python scripts/send_daily_email.py
